<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Stagewatch — Holographic</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #holo { position: fixed; inset: 0; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    color: #9ca3af; font: 16px "Segoe UI", system-ui, sans-serif; padding: 20px; }
  #msg a { color: #22d3ee; }
  #offline { position: fixed; left: 1vw; bottom: 1vh; color: #f59e0b; font: 12px system-ui; z-index: 1000; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="holo"></div>
<div id="msg" class="hidden"></div>
<div id="offline" class="hidden">reconnecting…</div>
<script src="common.js"></script>
<script src="holo.bundle.js"></script>
<script src="holo-page.js"></script>
</body>
</html>
