<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stagewatch Viewer</title>
<style>
  :root { --timer: #FFFFFF; --msg: #E2E8F0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #F9FAFB; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    justify-content: safe center; padding: 3vh 4vw; gap: 1.2vh; text-align: center; border: 0 solid var(--timer); transition: border-width .3s; }
  #stage.cueing { border-width: max(6px, 1.2vh); }
  #stage > * { flex-shrink: 0; }
  #stage.blackout > * { visibility: hidden; }
  #stage.blackout { border-width: 0; }
  .hidden { display: none !important; }
  .reserve { visibility: hidden; }
  #title { font-size: min(5vw, 6vh); opacity: .65; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #timer { font-weight: 700; line-height: 1; color: var(--timer); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    white-space: nowrap; transition: color .3s; }
  #cue { font-size: min(6vw, 8vh); font-weight: 800; letter-spacing: .06em; color: var(--timer); border: .12em solid currentColor;
    border-radius: .3em; padding: 0 .45em; line-height: 1.25; }
  #bar { width: min(80vw, 1400px); height: max(6px, 1.4vh); background: #1f1f1f; border-radius: 999px; overflow: hidden; }
  #bar.big { height: max(40px, 14vh); }
  #fill { height: 100%; width: 100%; background: var(--timer); transition: width 1s linear, background-color .3s; }
  #finishby, #endtime, #schedule { font-size: min(3.4vw, 4.4vh); opacity: .6; font-weight: 600; font-variant-numeric: tabular-nums; }
  #finishby { opacity: .8; letter-spacing: .04em; }
  #aux { font-size: min(4.2vw, 5.4vh); font-weight: 700; color: #86efac; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  #message { font-size: min(8vw, 11vh); font-weight: 700; color: var(--msg); max-width: 100%; overflow-wrap: anywhere; line-height: 1.1; min-height: 1.1em; }
  #ackbox { min-height: 1.6em; font-size: min(3vw, 4vh); }
  #ackbox button { font: inherit; font-weight: 800; color: #000; background: var(--msg); border: 0; border-radius: .5em; padding: .3em 1.1em; cursor: pointer; }
  #ackbox .ok { color: #22C55E; font-weight: 700; }
  #next, #slides, #vt { font-size: min(3.4vw, 4.4vh); opacity: .55; }
  #vt { opacity: .85; color: #93C5FD; font-variant-numeric: tabular-nums; }
  #tod { font-size: min(4vw, 5vh); opacity: .55; font-variant-numeric: tabular-nums; }
  #preview { position: fixed; top: 10px; left: 12px; font-size: 14px; font-weight: 800; letter-spacing: .1em; color: #000; background: #F59E0B; border-radius: 6px; padding: 2px 8px; }
  #nudge { position: fixed; inset: 0; background: var(--timer); color: #000; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 3vh; font-size: min(9vw, 12vh); font-weight: 800; z-index: 20; text-align: center; padding: 4vw; }
  #nudge small { font-size: min(3vw, 4vh); font-weight: 600; opacity: .7; }
  .flash-slow { animation: flash 1s steps(1) infinite; }
  .flash-fast { animation: flash .33s steps(1) infinite; }
  @keyframes flash { 50% { opacity: .15; } }
  @media (prefers-reduced-motion: reduce) { .flash-slow, .flash-fast { animation: none; text-decoration: underline; } }
  #offline { position: fixed; top: 10px; right: 12px; font-size: 13px; color: #F59E0B; opacity: .9; }
  #watermark { z-index: 1000; position: fixed; right: 2vw; bottom: 1.2vh; font-size: max(14px, 3.2vh); font-weight: 600;
    color: rgba(255,255,255,.7); text-shadow: 0 0 6px #000; pointer-events: none; z-index: 10; }
  /* Holographic style: the three.js canvas sits behind the stage; the flat text hides, the cue frame,
     the "Got it" button, nudges, holding images and the watermark stay on top and keep working. */
  #holo { position: fixed; inset: 0; z-index: 0; }
  #stage { z-index: 1; }
  body.holo #stage > *:not(#ackbox) { display: none !important; }
  body.holo #stage { justify-content: flex-end; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .35; }
</style>
</head>
<body>
<div id="holo" class="hidden"></div>
<div id="stage">
  <div id="title" class="hidden"></div>
  <div id="timer">--:--</div>
  <div id="cue" class="hidden"></div>
  <div id="bar" class="hidden"><div id="fill"></div></div>
  <div id="finishby" class="hidden"></div>
  <div id="endtime" class="hidden"></div>
  <div id="aux" class="hidden"></div>
  <div id="message" class="hidden"></div>
  <div id="ackbox" class="hidden"></div>
  <div id="slides" class="hidden"></div>
  <div id="vt" class="hidden"></div>
  <div id="next" class="hidden"></div>
  <div id="schedule" class="hidden"></div>
  <div id="tod" class="hidden"></div>
</div>
<div id="nudge" class="hidden"><div id="nudgeText"></div><small>Tap to acknowledge</small></div>
<div id="preview" class="hidden">PREVIEW</div>
<div id="watermark" class="hidden"></div>
<div id="offline" class="hidden">reconnecting…</div>
<div id="hint">Tap for full screen</div>
<script src="/common.js"></script>
<script src="/viewer.js"></script>
</body>
</html>
