<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Stagewatch Remote</title>
<style>
  :root { --bg: #000; --panel: #0d0d0d; --raised: #1a1a1a; --border: #2a2a2a; --text: #F9FAFB; --muted: #9CA3AF;
    --accent: #22C55E; --red: #DC2626; --amber: #F59E0B; --timer: #FFFFFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; font-size: 15px; }
  body { padding: 12px 16px 40px; max-width: 900px; margin: 0 auto; }
  .hidden { display: none !important; }
  h2 { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  #face { text-align: center; }
  #title { color: var(--muted); font-weight: 600; min-height: 1.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #timer { font-size: clamp(56px, 18vw, 140px); font-weight: 700; line-height: 1.05; color: var(--timer); font-variant-numeric: tabular-nums; }
  #bar { height: 6px; background: #1f1f1f; border-radius: 99px; overflow: hidden; margin: 6px auto 8px; max-width: 520px; }
  #fill { height: 100%; width: 0; background: var(--timer); transition: width 1s linear; }
  #meta { color: var(--muted); font-size: 13px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  #msgnow { margin-top: 8px; font-weight: 700; overflow-wrap: anywhere; }
  button { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 10px; min-height: 48px; cursor: pointer; touch-action: manipulation; }
  button:active { transform: translateY(1px); filter: brightness(1.3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  button.danger.on { background: var(--red); border-color: var(--red); }
  .row { display: grid; gap: 8px; }
  .transport { grid-template-columns: 2fr 1fr 1fr 1fr 1fr; }
  .nudge { grid-template-columns: repeat(6, 1fr); margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { min-height: 40px; padding: 8px 12px; font-size: 14px; }
  .presets { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .presets button { text-align: left; }
  .presets small, .item small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .item { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; text-align: left; width: 100%; margin-bottom: 6px; align-items: center; }
  .item.current { border-color: var(--accent); background: #0f2a18; }
  .item.done { opacity: .5; }
  .item .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  input, select { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 12px; min-height: 46px; width: 100%; }
  .msgrow { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 8px; margin-top: 8px; }
  #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px; background: #111; color: var(--muted); font-size: 13px;
    border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
  #status .bad { color: var(--amber); }
  #pinbox { max-width: 360px; margin: 18vh auto 0; text-align: center; }
  #pinbox input { text-align: center; font-size: 28px; letter-spacing: .3em; margin: 12px 0; }
  .mode { grid-template-columns: repeat(3, 1fr); }
  .mode button.on { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 520px) {
    .transport { grid-template-columns: 1fr 1fr 1fr; }
    .transport #toggle { grid-column: span 3; }
    .nudge { grid-template-columns: repeat(3, 1fr); }
    .msgrow { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div id="pinbox" class="hidden">
  <h1 style="font-size:22px;margin:0">Stagewatch remote</h1>
  <p style="color:var(--muted)">Enter the PIN shown in Stagewatch → Settings → Remote.</p>
  <input id="pin" inputmode="numeric" autocomplete="off" maxlength="12">
  <button class="primary" id="pinok" style="width:100%">Connect</button>
  <p id="pinerr" style="color:var(--red)"></p>
</div>

<div id="app" class="hidden">
  <div class="panel" id="face">
    <div id="title"></div>
    <div id="timer">--:--</div>
    <div id="bar" class="hidden"><div id="fill"></div></div>
    <div id="meta"><span id="endtime"></span><span id="schedule"></span><span id="next"></span></div>
    <div id="msgnow"></div>
  </div>

  <h2>TRANSPORT</h2>
  <div class="row transport">
    <button class="primary" id="toggle">Start</button>
    <button data-cmd="previous">◀ Prev</button>
    <button data-cmd="next">Next ▶</button>
    <button data-cmd="reset">Reset</button>
    <button class="danger" id="blackout">Blackout</button>
  </div>
  <div class="row nudge">
    <button data-cmd="nudge" data-arg="-300">−5m</button>
    <button data-cmd="nudge" data-arg="-60">−1m</button>
    <button data-cmd="nudge" data-arg="-10">−10s</button>
    <button data-cmd="nudge" data-arg="10">+10s</button>
    <button data-cmd="nudge" data-arg="60">+1m</button>
    <button data-cmd="nudge" data-arg="300">+5m</button>
  </div>
  <div class="row mode" style="margin-top:8px">
    <button data-mode="countdown">Countdown</button>
    <button data-mode="countup">Count up</button>
    <button data-mode="tod">Clock</button>
  </div>

  <h2>MESSAGE</h2>
  <input id="msg" placeholder="Message to the presenter" maxlength="500">
  <div class="msgrow">
    <select id="urgency"><option value="info">Info</option><option value="warn">Warning</option><option value="crit">Critical</option></select>
    <select id="flash"><option value="off">No flash</option><option value="slow">Slow flash</option><option value="fast">Fast flash</option></select>
    <button class="primary" id="send">Send</button>
    <button data-cmd="clearmessage">Clear</button>
  </div>
  <div class="chips" id="bank" style="margin-top:8px"></div>

  <div id="rundownWrap" class="hidden">
    <h2>RUNNING ORDER</h2>
    <div id="rundown"></div>
  </div>

  <h2>PRESETS</h2>
  <div class="row presets" id="presets"></div>
</div>

<div id="status"><span id="conn">connecting…</span><span id="err"></span></div>

<script src="/common.js"></script>
<script src="/control.js"></script>
</body>
</html>
