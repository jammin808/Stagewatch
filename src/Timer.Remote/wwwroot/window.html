<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Stagewatch window</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  /* Two frames, one on screen and one loading behind it: a page is swapped in only once it has drawn. */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; opacity: 0; visibility: hidden; z-index: 1; }
  /* Drawn by the window itself, so they show with no page and no network: the holding page, black, the warning. */
  #hold { position: fixed; inset: 0; z-index: 10; background: #000; display: none; align-items: center; justify-content: center; }
  #hold img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  #hold .words { position: relative; max-width: 88vw; color: #F9FAFB; text-align: center; overflow-wrap: anywhere; line-height: 1.15;
    font: 700 min(8vw, 11vh) "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  #hold .idle { position: relative; color: #2a2a2a; letter-spacing: .3em; font: 600 2.4vh "Segoe UI", system-ui, sans-serif; text-transform: uppercase; }
  #black { position: fixed; inset: 0; z-index: 12; background: #000; display: none; }
  #lost { position: fixed; left: 0; right: 0; top: 0; z-index: 20; display: none; padding: 1.4vh 3vw; text-align: center;
    background: #b91c1c; color: #fff; font: 700 max(18px, 3.4vh) "Segoe UI", system-ui, sans-serif; letter-spacing: .02em; }
  html.lost-warn iframe, html.lost-warn #hold { opacity: .22 !important; filter: grayscale(1); }
  html.lost-warn #lost { display: block; }
  #ident { position: fixed; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #0b1220; color: #fff; text-align: center; border: 1.2vh solid #22d3ee; font-family: "Segoe UI", system-ui, sans-serif; }
  #ident .big { font-size: 12vh; font-weight: 800; padding: 0 4vw; }
  #ident .small { margin-top: 3vh; font-size: 3.4vh; opacity: .7; }
  #gone { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 6vw; text-align: center;
    background: #000; color: #6b7280; font: 600 max(16px, 2.6vh) "Segoe UI", system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) { iframe { transition: none !important; } }
</style>
</head>
<body>
<iframe id="fa" title="Stagewatch page" allow="autoplay; fullscreen; screen-wake-lock" referrerpolicy="no-referrer"></iframe>
<iframe id="fb" title="Stagewatch page" allow="autoplay; fullscreen; screen-wake-lock" referrerpolicy="no-referrer"></iframe>
<div id="hold"><img alt=""><div class="words"></div><div class="idle"></div></div>
<div id="black"></div>
<div id="lost">NOT CONNECTED TO STAGEWATCH — the time shown may be out of date</div>
<div id="ident"><div class="big"></div><div class="small"></div></div>
<div id="gone">This window's address was replaced or removed. Ask the Stagewatch operator for the new one.</div>
<script src="/window.js"></script>
</body>
</html>
