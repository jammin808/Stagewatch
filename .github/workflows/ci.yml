# Stagewatch CI: every push and pull request builds everything, runs every test suite and the UI/page smoke tests,
# and builds the installer and the Companion module. A tag like v2.11.1 also publishes a GitHub Release with them.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-package:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            companion-module/package-lock.json
            src/Timer.Remote/holo/package-lock.json

      - name: Install Node dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund --prefix companion-module
          npm ci --no-audit --no-fund --prefix src/Timer.Remote/holo

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # Builds, runs the C# tests, the Companion module tests and the 3D display tests, publishes the single-file app,
      # packages the Companion module and compiles the installer. Code signing runs only when a certificate is set up.
      - name: Build, test and package (tools/release.ps1)
        shell: pwsh
        run: ./tools/release.ps1 -NoBump

      - name: Upload installer and Companion module
        uses: actions/upload-artifact@v4
        with:
          name: stagewatch-${{ github.sha }}
          path: |
            installer/Output/Stagewatch-Setup-*.exe
            companion-module/stagewatch-*.tgz
          if-no-files-found: error

  smoke:
    name: UI and page smoke tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Smoke tests (tools/smoke.ps1)
        shell: pwsh
        run: ./tools/smoke.ps1 -Out artifacts/smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ github.sha }}
          path: artifacts/smoke
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test-package, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stagewatch-${{ github.sha }}
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Stagewatch ${GITHUB_REF_NAME#v}" \
            --generate-notes $(find dist -type f \( -name '*.exe' -o -name '*.tgz' \))
